[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biovision"
version = "0.1.0"
description = "Modular biological vision systems with mathematical image reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "streamlit>=1.50", "fastapi>=0.115", "uvicorn[standard]>=0.30",
       "python-multipart>=0.0.9", "httpx>=0.27"]

[project.scripts]
biovision = "biovision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"biovision.samples" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
